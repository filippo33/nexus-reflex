<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NEXUS · Daily Speed & Precision Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky"><div class="sun"></div><div class="grid"></div></div>
  <div class="scan"></div>

  <button id="mute" class="ghost" aria-label="Toggle Audio">♪</button>

  <main>
    <!-- MENU / HOME -->
    <section id="menu" class="screen on">
      <h1 class="logo" data-t="NEXUS">NEXUS</h1>
      <p class="sub" id="day">NEXUS #0</p>
      
      <div class="stats">
        <div><b id="streak">0</b><small>streak</small></div>
        <div><b id="best">0</b><small>best</small></div>
        <div><b id="total">0</b><small>today</small></div>
      </div>

      <button id="ice" class="ghost iceb">BLACK ICE · OFF</button>
      <p class="icep">Max difficulty mode for hardcore netrunners.</p>

      <div id="cards"></div>

      <div class="foot">
        <button id="share" class="ghost">Share Results</button>
        <span>Next Reset in <b id="cd">--:--:--</b></span>
      </div>
    </section>

    <!-- GAME ARENA -->
    <section id="game" class="screen">
      <header>
        <button id="back" class="ghost">‹ Exit</button>
        <div id="gt">SPRINT</div>
        <div id="gr">1/3</div>
      </header>
      <div id="arena"></div>
    </section>

    <!-- RESULT SCREEN -->
    <section id="result" class="screen"></section>
  </main>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
